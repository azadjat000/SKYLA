[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyla"
version = "0.1.0"
description = "Local-first personal computer assistant"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
audio = ["psutil", "webrtcvad", "faster-whisper"]

[project.scripts]
skyla = "skyla.cli:main"

[tool.setuptools.packages.find]
include = ["skyla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
